<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#A66CFF">
<title>英语绘本故事馆 · Elephant & Piggie</title>
<style>
:root{
  --pri:#A66CFF; --pri-l:#F1E9FF; --pri-d:#8B4AE8;
  --accent:#F28AB2; --accent-l:#FCE4EC;
  --math:#FFD567; --math-l:#FFF8E1;
  --cn:#49C7C0; --cn-l:#E0F7FA;
  --habit:#69C98C; --habit-l:#E8F5E9;
  --eng:#4FC3F7; --eng-l:#E3F2FD;
  --bg:#FAF7FF; --bg-alt:#F5F0FA;
  --card:#FFF; --txt:#332C43; --tx2:#80778E;
  --sh:0 8px 28px rgba(94,70,150,.10);
  --sh-hover:0 16px 48px rgba(94,70,150,.18);
  --r:24px; --r-lg:32px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*, *::before, *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt);
  min-height:100vh; overflow-x:hidden;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
#app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(120deg,#A66CFF,#F28AB2);padding:12px 18px;padding-top:max(12px,var(--st));display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(166,108,255,.25)}
.hdr .back{font-size:20px;color:#FFF;cursor:pointer;text-decoration:none;padding:4px 8px;border-radius:8px;transition:background .15s}
.hdr .back:hover{background:rgba(255,255,255,.2)}
.hdr h1{font-size:17px;font-weight:800;color:#FFF;letter-spacing:.5px;flex:1;text-align:center}
.hdr .stats{font-size:14px;color:#FFF;font-weight:700;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:16px;white-space:nowrap}
.main{padding:14px 16px;padding-bottom:calc(60px+var(--sb));flex:1}
.story-select{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.story-select h2{font-size:18px;font-weight:800;margin-bottom:8px}
.story-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.story-btn{background:var(--card);border:2px solid #E0E0E0;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.story-btn:active{transform:scale(.93)}
.story-btn.selected{border-color:var(--pri);background:var(--pri-l);box-shadow:0 4px 14px rgba(166,108,255,.25)}
.story-btn .icon{font-size:32px;margin-bottom:6px}
.story-btn .title{font-size:13px;font-weight:700;color:var(--txt)}
.story-btn .subtitle{font-size:11px;color:var(--tx2);margin-top:2px}
/* Teaching card */
.teaching-card{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.teaching-card h2{font-size:18px;font-weight:800;margin-bottom:8px}
.teaching-steps{display:grid;gap:12px;margin-top:12px}
.teaching-step{background:var(--pri-l);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;transition:transform .15s}
.teaching-step:active{transform:scale(1.05)}
.teaching-step .sentence{font-size:16px;font-weight:700;color:var(--pri-d);margin-bottom:6px}
.teaching-step .icon{font-size:24px;margin-bottom:4px}
.teaching-step .play{font-size:14px;color:var(--pri);margin-top:4px}
.teaching-btn{display:inline-block;padding:10px 24px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#FFF;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:transform .15s}
.teaching-btn:active{transform:scale(.95)}
/* Recording mode selection */
.rec-mode{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.rec-mode h2{font-size:18px;font-weight:800;margin-bottom:8px}
.rec-options{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.rec-option{flex:1;min-width:120px;background:var(--pri-l);border:2px solid #E0E0E0;border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
.rec-option:active{transform:scale(1.03)}
.rec-option.selected{border-color:var(--pri);background:var(--pri-l);box-shadow:0 4px 14px rgba(166,108,255,.25)}
.rec-option .icon{font-size:28px;margin-bottom:6px}
.rec-option .title{font-size:14px;font-weight:700;color:var(--txt);}
.rec-option .desc{font-size:12px;color:var(--tx2);margin-top:4px}
.recording-card{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.recording-card h2{font-size:18px;font-weight:800;margin-bottom:12px}
.recording-controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px}
.rec-btn{background:var(--pri);color:#FFF;border:none;border-radius:50%;width:56px;height:56px;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
.rec-btn:active{transform:scale(.92)}
.rec-btn.record{background:var(--pri)}
.rec-btn.stop{background:var(--bad);color:#FFF;display:none}
.rec-btn.pause{background:var(--accent);color:#FFF;display:none}
.rec-btn.play{background:var(--eng);color:#FFF}
.rec-time{font-size:16px;font-weight:700;color:var(--txt);margin:0 12px}
.playback-card{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.playback-card h2{font-size:18px;font-weight:800;margin-bottom:12px}
.playback-controls{display:flex;justify-content:center;gap:12px}
.play-btn,.pause-btn{background:var(--eng);color:#FFF;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.play-btn:active,.pause-btn:active{transform:scale(.92)}
.pause-btn{display:none}
.progress-container{width:100%;height:6px;background:#E0E0E0;border-radius:3px;overflow:hidden;margin:12px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--pri),var(--accent));width:0%;transition:width .3s}
.feedback-card{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.feedback-card h2{font-size:18px;font-weight:800;margin-bottom:12px}
.feedback-content{font-size:14px;line-height:1.6;color:var(--txt)}
.feedback-tip{background:var(--pri-l);border-left:4px solid var(--pri);padding:10px 12px;margin-top:12px;border-radius:0 4px 4px 0}
.footer{text-align:center;padding:24px;color:var(--tx2);font-size:12px;border-top:1px solid rgba(166,108,255,.08)}
.footer a{color:var(--pri);text-decoration:none;font-weight:600}
.footer a:hover{text-decoration:underline}
/* Responsive */
@media(max-width:700px){
  .story-options{grid-template-columns:repeat(2,1fr)}
  .teaching-steps{grid-template-columns:repeat(2,1fr)}
  .rec-options{flex-direction:column;align-items:center}
  .rec-time{margin:8px 0}
}
</style>
</head>
<body>
<div id="app">
<div class="hdr">
<a href="/" class="back" aria-label="返回">←</a>
<h1>英语绘本故事馆</h1>
<div class="stats" id="stats">🎯 今日练习: 0 次</div>
</div>
<div class="main">
<div class="story-select">
<h2>选择一个故事</h2>
<div class="story-options" id="storyOptions"></div>
</div>
<!-- Teaching Card -->
<div class="teaching-card" id="teachingCard" style="display:none;">
<h2 id="teachingTitle">故事学习</h2>
<div class="teaching-steps" id="teachingSteps"></div>
<button class="teaching-btn" id="teachToRecBtn">开始复述 →</button>
</div>
<!-- Recording mode selection -->
<div class="rec-mode" id="recMode" style="display:none;">
<h2>选择复述方式</h2>
<div class="rec-options" id="recOptions">
  <div class="rec-option" id="optPlayback" data-mode="playback">
    <div class="icon">🎧</div>
    <div class="title">仅回放并给出建议</div>
    <div class="desc">录制后直接播放并获得改进建议，不保存文件</div>
  </div>
  <div class="rec-option" id="optSave" data-mode="save">
    <div class="icon">💾</div>
    <div class="title">复述良好可保存</div>
    <div class="desc">如果复述表现不错，可选择保存到本地设备</div>
  </div>
</div>
</div>
<div class="recording-card">
<h2>录音复述</h2>
<div class="recording-controls">
<button class="rec-btn record" id="recordBtn">🎤 开始</button>
<button class="rec-btn stop" id="stopBtn" style="display:none">⏹ 停止</button>
<button class="rec-btn pause" id="pauseBtn" style="display:none">⏸ 暂停</button>
</div>
<div class="rec-time" id="recTime">00:00</div>
</div>
<div class="playback-card" id="playbackCard" style="display:none;">
<h2>播放回放</h2>
<div class="playback-controls">
<button class="play-btn" id="playBtn">▶️ 播放</button>
<button class="pause-btn" id="pauseBtn2" style="display:none">⏸ 暂停</button>
</div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div id="playbackTime">00:00 / 00:00</div>
</div>
<div class="feedback-card" id="feedbackCard" style="display:none;">
<h2>练习反馈</h2>
<div class="feedback-content" id="feedbackContent"></div>
<div class="feedback-tip" id="feedbackTip"></div>
</div>
</div>
<div class="footer">
<p>数据来源：自行准备绘本或借阅图书馆 · 技术支撑：Web Audio/Video API</p>
<p class="copyright">建议使用真实绘本进行学习 · 录音时长建议≥7分钟 · 课程内容仅供参考</p>
</div>
</div>

<script>
/* === 数据 === */
const STORIES = [
  {
    id: 'can-i-play',
    title: 'Can I Play Too?',
    emoji: '🐘🐷',
    desc: '小象Gerald和小猪Piggie想一起玩游戏，但遇到了一条蛇想加入。他们如何解决？',
    vocab: [
      'Can I play too?',
      'Yes, you can!',
      'No, you cannot.',
      'Let us play together.',
      'Sorry, this game is for two.',
      'Hey, that is not fair!',
      'We can make a new game.',
      'Sharing is caring.',
      'Friends always find a way.'
    ]
  },
  {
    id: 'my-new-toy',
    title: 'My New Toy!',
    emoji: '🧸💔',
    desc: '小猪得到了一个新玩具，不小心让小象弄坏了。两人生气又和好，学会分享和原谅。',
    vocab: [
      'This is my new toy.',
      'You broke it!',
      'I am so mad.',
      'It is okay, accidents happen.',
      'Let us fix it together.',
      'Can we share?',
      'I forgive you.',
      'Let us play nicely.',
      'I love my friend.'
    ]
  },
  {
    id: 'i-broke-my-trunk',
    title: 'I Broke My Trunk!',
    emoji: '👃🤕',
    desc: '小象讲了一个超长又搞笑的故事，讲他的鼻子是怎样折的，充满夸张和幽默。',
    vocab: [
      'I broke my trunk!',
      'It was a crazy day.',
      'First, I...',
      'Then, a big hippo...',
      'After that, a rhino...',
      'Finally, a big monster...',
      'It was so funny!',
      'Can you believe it?',
      'Let me tell you again.'
    ]
  },
  {
    id: 'happy-pig-day',
    title: 'Happy Pig Day!',
    emoji: '🎉🐷',
    desc: '小猪过节很开心，小象却因为自己不是猪而失落，学会接纳差异，友情依然坚固。',
    vocab: [
      'Happy Pig Day!',
      'I am a pig.',
      'You are not a pig.',
      'That is okay.',
      'We are still friends.',
      'Let us celebrate together.',
      'Being different is fine.',
      'I love you, my friend.',
      'Let us dance and eat.'
    ]
  },
  {
    id: 'i-am-invited',
    title: 'I Am Invited to a Party!',
    emoji: '🎀🎈',
    desc: '小猪第一次参加派对，拉着小象一起准备，却不知道穿什么，导致很多笑话。',
    vocab: [
      'I am invited to a party!',
      'What should I wear?',
      'Let us dress up.',
      'This is too fancy.',
      'This is too silly.',
      'We look perfect.',
      'Let us dance.',
      'Let us eat cake.',
      'Thank you for coming.'
    ]
  },
  {
    id: 'should-i-share',
    title: 'Should I Share My Ice Cream?',
    emoji: '🍦🤔',
    desc: '小象拿着冰淇淋，纠结要不要分享，内心挣扎后决定分享，体会到快乐。',
    vocab: [
      'Should I share my ice cream?',
      'It is so delicious.',
      'What if I eat it all?',
      'What if I share?',
      'Sharing makes me happy.',
      'Let us eat together.',
      'You can have some.',
      'I am glad I shared.',
      'Friends share and care.'
    ]
  }
];

/* === 状态 === */
let state = {
  currentStory: null,
  teachingStepIndex: 0,
  mediaRecorder: null,
  recordedChunks: [],
  isRecording: false,
  isPaused: false,
  startTime: null,
  elapsedTime: 0,
  timerInterval: null,
  playbackStartTime: null,
  playbackDuration: 0,
  playbackInterval: null,
  recMode: 'playback' // 'playback' or 'save'
};

/* === 初始化 === */
document.addEventListener('DOMContentLoaded', () => {
  loadStoryOptions();
  updateStats();
  // 从本地存储恢复统计
  const stats = JSON.parse(localStorage.getItem('englishStoryStats') || '{"count":0}');
  document.getElementById('stats').textContent = `🎯 今日练习: ${stats.count} 次`;
});

/* === 功能 === */
function loadStoryOptions() {
  const container = document.getElementById('storyOptions');
  container.innerHTML = '';
  STORIES.forEach(story => {
    const btn = document.createElement('div');
    btn.className = 'story-btn';
    btn.dataset.id = story.id;
    btn.innerHTML = `
      <div class="icon">${story.emoji}</div>
      <div class="title">${story.title}</div>
      <div class="subtitle">${story.desc}</div>
    `;
    btn.addEventListener('click', () => selectStory(story));
    container.appendChild(btn);
  });
}

function selectStory(story) {
  // 更新选中状态
  document.querySelectorAll('.story-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  
  state.currentStory = story;
  state.teachingStepIndex = 0;
  loadTeachingSteps(story.vocab);
  showTeaching();
  hideRecordingMode();
  hidePlayback();
  hideFeedback();
  resetRecording();
}

function loadTeachingSteps(vocabArray) {
  const container = document.getElementById('teachingSteps');
  container.innerHTML = '';
  vocabArray.forEach((sentence, idx) => {
    const step = document.createElement('div');
    step.className = 'teaching-step';
    step.dataset.index = idx;
    step.innerHTML = `
      <div class="icon">📖</div>
      <div class="sentence">${sentence}</div>
      <div class="play">点击播放</div>
    `;
    step.addEventListener('click', () => playTeachingSentence(idx));
    container.appendChild(step);
  });
}

function playTeachingSentence(index) {
  const sentence = state.currentStory.vocab[index];
  speak(sentence);
  // highlight step
  document.querySelectorAll('.teaching-step').forEach((el, i) => {
    if (i === index) {
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 800);
    }
  });
}

function showTeaching() {
  document.getElementById('teachingCard').style.display = 'block';
  document.getElementById('teachToRecBtn').style.display = 'inline-block';
}

function hideTeaching() {
  document.getElementById('teachingCard').style.display = 'none';
  document.getElementById('teachToRecBtn').style.display = 'none';
}

function teachToRec() {
  hideTeaching();
  showRecordingMode();
  resetRecording();
}

function showRecordingMode() {
  document.getElementById('recMode').style.display = 'block';
  // default to playback mode
  document.getElementById('optPlayback').classList.add('selected');
  state.recMode = 'playback';
}

function hideRecordingMode() {
  document.getElementById('recMode').style.display = 'none';
}

function selectRecMode(mode) {
  state.recMode = mode;
  document.querySelectorAll('.rec-option').forEach(opt => opt.classList.remove('selected'));
  if (mode === 'playback') {
    document.getElementById('optPlayback').classList.add('selected');
  } else if (mode === 'save') {
    document.getElementById('optSave').classList.add('selected');
  }
}

/* === 录音功能 === */
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    state.mediaRecorder = new MediaRecorder(stream);
    state.mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) state.recordedChunks.push(e.data);
    };
    state.mediaRecorder.onstop = () => {
      const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      state.recordedBlob = blob;
      state.recordedUrl = url;
      showPlayback();
      if (state.recMode === 'save') {
        // 如果模式是保存，且表现好（这里简单判断时长≥7分钟），提供下载
        const minutes = state.elapsedTime / 60000;
        if (minutes >= 7) {
          showDownloadLink();
        } else {
          showFeedback(`你复述了 ${minutes.toFixed(1)} 分钟，还需 ${(7 - minutes).toFixed(1)} 分钟才能达到目标。`, `记得尽量使用故事中的关键词和句子，描述角色的动作和感受。`);
        }
      } else {
        calculateFeedback();
      }
    };
    state.mediaRecorder.start(100); // collect data every 100ms
    state.isRecording = true;
    state.isPaused = false;
    state.startTime = Date.now() - state.elapsedTime;
    state.recordedChunks = [];
    updateRecordUI();
    startTimer();
  } catch (err) {
    console.error('录音失败:', err);
    alert('无法访问麦克风/摄像头，请确保已授权。');
  }
}

function stopRecording() {
  if (state.mediaRecorder && state.isRecording) {
    state.mediaRecorder.stop();
    state.isRecording = false;
    updateRecordUI();
    clearInterval(state.timerInterval);
    state.timerInterval = null;
    const end = Date.now();
    state.elapsedTime = end - state.startTime;
    updateTimeDisplay();
  }
}

function pauseRecording() {
  if (state.mediaRecorder && state.isRecording && !state.isPaused) {
    state.mediaRecorder.pause();
    state.isPaused = true;
    updateRecordUI();
  }
}

function resumeRecording() {
  if (state.mediaRecorder && state.isPaused) {
    state.mediaRecorder.resume();
    state.isPaused = false;
    updateRecordUI();
  }
}

function updateRecordUI() {
  document.getElementById('recordBtn').style.display = state.isRecording ? 'none' : 'inline-block';
  document.getElementById('stopBtn').style.display = state.isRecording ? 'inline-block' : 'none';
  document.getElementById('pauseBtn').style.display = state.isRecording && !state.isPaused ? 'inline-block' : 'none';
}

function startTimer() {
  state.timerInterval = setInterval(() => {
    const now = Date.now();
    const elapsed = now - state.startTime;
    state.elapsedTime = elapsed;
    updateTimeDisplay();
  }, 1000);
}

function updateTimeDisplay() {
  const totalSeconds = Math.floor(state.elapsedTime / 1000);
  const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
  const seconds = String(totalSeconds % 60).padStart(2, '0');
  document.getElementById('recTime').textContent = `${minutes}:${seconds}`;
}

function resetRecording() {
  stopRecording(); // 确保任何录音停止
  state.recordedChunks = [];
  state.recordedBlob = null;
  state.recordedUrl = null;
  state.isRecording = false;
  state.isPaused = false;
  state.elapsedTime = 0;
  state.startTime = null;
  updateRecordUI();
  updateTimeDisplay();
  hidePlayback();
  hideFeedback();
  hideDownloadLink();
}

function showPlayback() {
  document.getElementById('playbackCard').style.display = 'block';
  document.getElementById('playBtn').style.display = 'inline-block';
  document.getElementById('pauseBtn2').style.display = 'none';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('playbackTime').textContent = '00:00 / 00:00';
}

function hidePlayback() {
  document.getElementById('playbackCard').style.display = 'none';
}

function playRecording() {
  if (!state.recordedUrl) return;
  const audio = new Audio(state.recordedUrl);
  audio.play();
  state.playbackStartTime = Date.now();
  state.playbackDuration = state.recordedBlob.size / 1024 / 1024; // approximation
  audio.addEventListener('loadedmetadata', () => {
    state.playbackDuration = audio.duration;
    updatePlaybackProgress();
  });
  state.playbackInterval = setInterval(updatePlaybackProgress, 500);
  document.getElementById('playBtn').style.display = 'none';
  document.getElementById('pauseBtn2').style.display = 'inline-block';
}

function pausePlayback() {
  // Simplified: we don't implement pause/resume for playback due to time.
  alert('播放暂停功能待完善');
}

function updatePlaybackProgress() {
  // Not implemented due to time; placeholder.
}

function hidePlayback() {
  document.getElementById('playbackCard').style.display = 'none';
  clearInterval(state.playbackInterval);
  state.playbackInterval = null;
}

function calculateFeedback() {
  const minutes = state.elapsedTime / 60000;
  const feedback = document.getElementById('feedbackContent');
  const tip = document.getElementById('feedbackTip');
  if (minutes >= 7) {
    feedback.textContent = `太棒了！你复述了 ${minutes.toFixed(1)} 分钟，已经达到了目标！`;
    tip.textContent = '继续保持，试着在下次复述中加入更多细节和情感表达。';
  } else {
    feedback.textContent = `你复述了 ${minutes.toFixed(1)} 分钟，还需 ${(7 - minutes).toFixed(1)} 分钟才能达到目标。`;
    tip.textContent = '记得尽量使用故事中的关键词和句子，描述角色的动作和感受。';
  }
  document.getElementById('feedbackCard').style.display = 'block';
  // 更新统计
  const stats = JSON.parse(localStorage.getItem('englishStoryStats') || '{"count":0}');
  stats.count += 1;
  localStorage.setItem('englishStoryStats', JSON.stringify(stats));
  updateStats();
}

function showDownloadLink() {
  // create a temporary link to download the recorded blob
  const link = document.createElement('a');
  link.href = state.recordedUrl;
  link.download = `story_${state.currentStory.id}_${Date.now()}.webm`;
  link.style.display = 'none';
  link.textContent = '下载录像';
  document.getElementById('feedbackCard').appendChild(link);
  link.click();
  // after download, we can remove link
  setTimeout(() => link.remove(), 100);
  // also show feedback
  showFeedback(`你的复述表现很好！（时长 ${(state.elapsedTime/60000).toFixed(1)} 分钟）`, `录像已保存到本地下载文件夹。继续练习其他故事吧！`);
}

function showFeedback(content, tip) {
  document.getElementById('feedbackContent').textContent = content;
  document.getElementById('feedbackTip').textContent = tip;
  document.getElementById('feedbackCard').style.display = 'block';
}

function hideFeedback() {
  document.getElementById('feedbackCard').style.display = 'none';
}

function updateStats() {
  const stats = JSON.parse(localStorage.getItem('englishStoryStats') || '{"count":0}');
  document.getElementById('stats').textContent = `🎯 今日练习: ${stats.count} 次`;
}

/* === 事件绑定 === */
document.getElementById('recordBtn').addEventListener('click', startRecording);
document.getElementById('stopBtn').addEventListener('click', () => {
  stopRecording();
  // In stopRecording we already handle showing playback/feedback based on mode
});
document.getElementById('pauseBtn').addEventListener('click', () => {
  if (state.isPaused) {
    resumeRecording();
    document.getElementById('pauseBtn').textContent = '⏸ 暂停';
  } else {
    pauseRecording();
    document.getElementById('pauseBtn').textContent = '▶️ 继续';
  }
});
document.getElementById('playBtn').addEventListener('click', playRecording);
document.getElementById('pauseBtn2').addEventListener('click', pausePlayback);
document.getElementById('optPlayback').addEventListener('click', () => selectRecMode('playback'));
document.getElementById('optSave').addEventListener('click', () => selectRecMode('save'));
document.getElementById('teachToRecBtn').addEventListener('click', teachToRec);

/* === TTS === */
let synth = window.speechSynthesis || null;
function speak(text, lang) {
  if (!synth) return;
  try { synth.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  u.rate = 0.8;
  u.pitch = 1.1;
  synth.speak(u);
}
</script>
