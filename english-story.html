<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f0e8ff">
<meta name="app-version" content="story-child-v1">
<title>英语绘本故事馆 · 看图听故事</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}
#app{margin:auto}
/* 舞台 / 插图 */
.stage{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;
  background:var(--scene-bg,#EAF2FF);min-height:360px}
.stage svg.scene-bg{display:block;width:100%;height:100%;position:absolute;inset:0}
.stage .caption{position:absolute;left:0;right:0;top:0;z-index:4;
  background:linear-gradient(to bottom,rgba(28,18,48,.6),rgba(28,18,48,0));
  color:#FFF;font-size:12.5px;font-weight:700;padding:9px 14px 18px;
  text-shadow:0 1px 3px rgba(0,0,0,.45)}
.stage .tap-hint{position:absolute;right:10px;bottom:9px;z-index:4;font-size:11px;font-weight:700;
  color:#4C4463;background:rgba(255,255,255,.88);padding:3px 10px;border-radius:11px;
  box-shadow:0 2px 8px rgba(70,45,120,.12)}

/* 两个固定卡位：左槽 / 右槽，永不重叠 */
.stage .actor{position:absolute;bottom:12px;z-index:2;width:31%;
  display:flex;flex-direction:column;align-items:center}
.stage .actor.slot-l{left:2%}
.stage .actor.slot-r{right:2%}
.stage .actor .art{width:100%;max-width:138px;aspect-ratio:1;
  filter:drop-shadow(0 9px 14px rgba(40,25,70,.28))}
.stage .actor .art svg{width:100%;height:100%;display:block}
.stage .actor.mirror .art svg{transform:scaleX(-1)}
.stage .actor .tag{margin-top:5px;font-size:11px;font-weight:800;color:#FFF;
  padding:2px 11px;border-radius:11px;letter-spacing:.4px;white-space:nowrap;
  box-shadow:0 3px 9px rgba(40,25,70,.24)}
.stage .actor.talking .art{animation:bob .75s ease-in-out infinite}
.stage .actor.mirror.talking .art{animation-name:bob}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-9px) rotate(-2deg)}50%{transform:translateY(-13px) rotate(0)}75%{transform:translateY(-9px) rotate(2deg)}}
.stage .actor.mirror.talking .art svg{transform:scaleX(-1)}
.stage .actor:not(.talking) .art{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.stage .actor .art{animation:none}}

/* 气泡：只出现在正在说话的角色头顶，空间独占，绝不叠字 */
.stage .say{position:absolute;z-index:3;top:38px;width:46%;max-width:290px;
  background:#FFF;border-radius:17px;padding:10px 13px 11px;
  border:4px solid var(--c-accent,#A66CFF);
  box-shadow:0 10px 26px rgba(70,45,120,.28);cursor:pointer;
  transition:transform .16s,box-shadow .16s;
  animation:popIn .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.stage .say:hover{transform:scale(1.03);box-shadow:0 12px 28px rgba(70,45,120,.3)}
.stage .say:active{transform:scale(.97)}
.stage .say.bub-l{left:2%}
.stage .say.bub-r{right:2%}
.stage .say::after{content:'';position:absolute;bottom:-12px;width:0;height:0;
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-top:12px solid var(--c-accent,#A66CFF)}
.stage .say::before{content:'';position:absolute;bottom:-7px;width:0;height:0;z-index:1;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:9px solid #FFF}
.stage .say.bub-l::after,.stage .say.bub-l::before{left:26%}
.stage .say.bub-r::after,.stage .say.bub-r::before{right:26%}
.stage .say .hdr{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.stage .say .nm{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.stage .say .tn{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:8px}
.stage .say .en{font-size:15px;font-weight:800;color:#2B2440;line-height:1.3}
.stage .say .cn{font-size:11px;color:#7B7392;margin-top:3px;line-height:1.35}

/* 静止态：没人在说话时，两个角色都安静站着 */
.stage .quiet-tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;
  font-size:12px;font-weight:700;color:#5B5170;background:rgba(255,255,255,.9);
  padding:5px 14px;border-radius:14px;box-shadow:0 3px 10px rgba(70,45,120,.14)}


</style>

</head>

</html>
