    <style>

        #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* 3D 舞台 */
        #stage { position: fixed; inset: 0; z-index: 1; perspective: 1500px; cursor: grab; touch-action: none; }
        #stage.dragging { cursor: grabbing; }
        #scene { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
        .sphere { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
        #sphereA { transform: translate3d(-300px, 0, 0); }
        #sphereB { transform: translate3d(300px, 0, 0); }
        .spin { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }

        /* 轨道 */
        .ring { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%; border: 1.5px dashed rgba(130,175,255,.22); }
        .ring.r1 { transform: rotateX(78deg); }
        .ring.r2 { transform: rotateY(76deg) rotateZ(24deg); }
        .ring.r3 { transform: rotateZ(88deg) rotateX(80deg); }

        /* 中心核心（区分上下册） */
        .core { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; filter: blur(1px); }
        #sphereA .core { background: radial-gradient(circle at 35% 32%, #ffd9a0, #ff7a3c 55%, #c33c00); box-shadow: 0 0 45px rgba(255,140,60,.65), 0 0 90px rgba(255,100,30,.35); }
        #sphereB .core { background: radial-gradient(circle at 35% 32%, #c7f0ff, #35a8e8 55%, #0a5f9e); box-shadow: 0 0 45px rgba(60,170,255,.65), 0 0 90px rgba(30,120,255,.35); }

        /* 课节节点 */
        .node { position: absolute; left: 0; top: 0; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; transform-style: preserve-3d; cursor: pointer; transition: box-shadow .15s; }
        .node .ball { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset -3px -4px 8px rgba(0,0,0,.5), inset 2px 3px 6px rgba(255,255,255,.6), 0 3px 8px rgba(0,0,0,.5); }
        .node .ball::after { content: ""; position: absolute; top: 12%; left: 20%; width: 32%; height: 24%; border-radius: 50%; background: rgba(255,255,255,.8); filter: blur(1.5px); transform: rotate(-25deg); }
        .node:hover { z-index: 999; }
        .node:hover .ball { box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 0 22px rgba(255,255,255,.85), inset -3px -4px 8px rgba(0,0,0,.5); }

        /* 直接显示的课名标签（billboard：始终正对屏幕，按深度淡出） */
        .node .label {
            position: absolute; left: 50%; top: 100%;
            transform: translateX(-50%);
            transform-origin: 50% 0;
            margin-top: 4px;
            max-width: 132px;
            padding: 1px 6px;
            border-radius: 8px;
            background: rgba(6, 13, 30, .82);
            border: 1px solid rgba(140, 185, 255, .26);
            color: #e2ecff;
            font-size: 10.5px;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            box-shadow: 0 1px 5px rgba(0,0,0,.4);
            letter-spacing: .3px;
            opacity: 0;
            transition: color .12s, border-color .12s, background .12s;
        }
        .node:hover .label { color: #ffd24a; border-color: rgba(255,210,74,.5); background: rgba(20, 30, 56, .92); }

        .c0 .ball { background: radial-gradient(circle at 33% 30%, #ffb3a6, #ff5a4e 60%, #b3162f); }
        .c1 .ball { background: radial-gradient(circle at 33% 30%, #ffd9a0, #ff9a2e 60%, #c65a00); }
        .c2 .ball { background: radial-gradient(circle at 33% 30%, #fff5b8, #f5cf1f 60%, #b3890a); }
        .c3 .ball { background: radial-gradient(circle at 33% 30%, #d6ffb8, #84d944 60%, #3f8f1c); }
        .c4 .ball { background: radial-gradient(circle at 33% 30%, #a8f7dd, #1fc9a2 60%, #087e63); }
        .c5 .ball { background: radial-gradient(circle at 33% 30%, #a8e8ff, #35bcec 60%, #0b6fa8); }
        .c6 .ball { background: radial-gradient(circle at 33% 30%, #c2cbff, #6270f5 60%, #2a38bd); }
        .c7 .ball { background: radial-gradient(circle at 33% 30%, #ecc4ff, #ab5fee 60%, #6023ad); }

        #hud .sub { margin-top: 5px; font-size: 12px; color: rgba(255,255,255,.7); }
        #hud .sub b { color: #ffd24a; }
        #hint { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); font-size: 12px; }

        /* 球标识 */
        .volTag { position: fixed; z-index: 4; font-size: 15px; color: #fff; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,.7); pointer-events: none; opacity: .95; transform: translate(-50%, 0); white-space: nowrap; }
        .volTag span { display: block; font-size: 11px; color: rgba(255,255,255,.6); letter-spacing: 1px; margin-top: 3px; }

        /* tooltip */
        #tooltip { position: fixed; z-index: 9; max-width: 300px; padding: 9px 13px; border-radius: 10px; background: rgba(8,15,32,.95); border: 1px solid rgba(120,170,255,.5); color: #fff; font-size: 13px; line-height: 1.6; box-shadow: 0 8px 28px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .12s; }
        #tooltip .t-name { font-size: 14px; font-weight: bold; color: #ffd24a; }
        #tooltip .t-unit { color: rgba(255,255,255,.72); font-size: 12px; }
        #tooltip .t-go { margin-top: 3px; color: #6fb4ff; font-size: 11px; }

        /* 图例 */
        #legend { position: fixed; right: 0; top: 0; bottom: 0; z-index: 5; width: 268px; padding: 14px 10px 14px 14px; background: rgba(255,255,255,.06); border-left: 1px solid rgba(255,255,255,.13); backdrop-filter: blur(8px); display: flex; flex-direction: column; }
        #legend h3 { color: #fff; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; }
        #legendBody { flex: 1; overflow-y: auto; padding-right: 6px; }
        #legendBody::-webkit-scrollbar { width: 5px; }
        #legendBody::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 3px; }
        .lg-vol { margin: 10px 0 4px; font-size: 12px; font-weight: bold; color: #ffd24a; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.14); padding-bottom: 4px; }
        .lg-unit { display: flex; align-items: center; gap: 7px; padding: 5px 6px; margin: 2px 0; border-radius: 6px; color: rgba(255,255,255,.92); font-size: 12px; cursor: pointer; }
        .lg-unit:hover { background: rgba(255,255,255,.12); }
        .lg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .lg-caret { margin-left: auto; font-size: 10px; color: rgba(255,255,255,.5); transition: transform .18s; }
        .lg-lessons { display: none; margin: 2px 0 6px 18px; }

        .lg-lesson { padding: 4px 8px; margin: 1px 0; border-radius: 5px; font-size: 12px; color: rgba(255,255,255,.75); cursor: pointer; line-height: 1.4; }
        .lg-lesson:hover { background: rgba(120,180,255,.22); color: #fff; }

        /* 来源 */
        #src { position: fixed; left: 14px; bottom: 12px; z-index: 5; max-width: 300px; padding: 9px 12px; border-radius: 9px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.62); font-size: 11px; line-height: 1.65; }
        #src a { color: #7cc0ff; text-decoration: none; }

        /* ============ 响应式：iPad 横屏 / 竖屏 / 手机 ============ */
        /* 窄一点时图例栏收窄，把宽度让给 3D 舞台 */
        @media (max-width: 1280px) {
            #legend { width: 216px; padding: 12px 8px 12px 11px; }
            #legend h3 { font-size: 12px; }
            .lg-unit, .lg-lesson { font-size: 11.5px; }

        /* 竖屏 / 小屏：隐藏侧栏与来源，全屏给 3D */
        @media (max-width: 860px) {
            #legend { display: none; }
            #src { display: none; }
            #hud h1 { font-size: 18px; }
            #hud .sub { font-size: 11px; }
        }
        /* 横屏高度不足（iPad 横屏 768/810/820）时压缩 HUD */
        @media (max-height: 700px) {

            #hud h1 { font-size: 18px; letter-spacing: 1px; }
            #hud .sub { margin-top: 3px; font-size: 11px; }
            #hint { margin-top: 5px; padding: 3px 10px; font-size: 11px; }
            .volTag { font-size: 13px; }
            .volTag span { font-size: 10px; }
        }
        /* 触屏（iPad / 手机）：放大点击热区、关闭 hover 依赖 */
        @media (pointer: coarse) {
            .node::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; }
            .node .label { font-size: 11px; max-width: 128px; }
            #legendBody { -webkit-overflow-scrolling: touch; }
            .lg-lesson { padding: 7px 8px; }
        }

var R = 165;
var GROUPS = { A: [], B: [] };
KNOWLEDGE.forEach(function (k) { (GROUPS[k.vol] || (GROUPS[k.vol] = [])).push(k); });

document.getElementById('cnt').textContent = KNOWLEDGE.length;
document.getElementById('cntA').textContent = GROUPS.A.length + ' 课时';
document.getElementById('cntB').textContent = GROUPS.B.length + ' 课时';

var nodeEls = [];

function buildSphere(vol, spinId) {
    var spin = document.getElementById(spinId);
    var list = GROUPS[vol] || [];
    var n = list.length;

    for (var r = 1; r <= 3; r++) {
        var ring = document.createElement('div');
        ring.className = 'ring r' + r;
        spin.appendChild(ring);
    }
    var core = document.createElement('div');
    core.className = 'core';
    spin.appendChild(core);

    list.forEach(function (k, i) {
        var phi = Math.acos(1 - 2 * (i + 0.5) / n);
        var theta = Math.PI * (1 + Math.sqrt(5)) * i;
        var x = Math.cos(theta) * Math.sin(phi) * R;
        var z = Math.sin(theta) * Math.sin(phi) * R;
        var y = Math.cos(phi) * R;

        var el = document.createElement('div');
        el.className = 'node c' + (k.cid % 8);
        el.innerHTML = '<div class="ball"></div><div class="label">' + k.name + '</div>';
        el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,' + z.toFixed(1) + 'px)';
        spin.appendChild(el);
        nodeEls.push({ el: el, k: k, x: x, y: y, z: z, lab: el.querySelector('.label') });
    });
}
buildSphere('A', 'spinA');
buildSphere('B', 'spinB');

/* tooltip */
var tip = document.getElementById('tooltip');
var cur = null;
nodeEls.forEach(function (n) {
    n.el.addEventListener('mouseenter', function (e) { cur = n; show(e, n); tip.style.opacity = 1; });
    n.el.addEventListener('mousemove', function (e) { if (cur === n) show(e, n); });
    n.el.addEventListener('mouseleave', function () { tip.style.opacity = 0; cur = null; });
});
function show(e, n) {
    tip.innerHTML = '<div class="t-name">' + n.k.name + '</div><div class="t-unit">' +
        (n.k.vol === 'A' ? '一年级上册' : '一年级下册') + ' · ' + n.k.unit +
        '</div><div class="t-go">➜ 点击打开国家平台 · ' + n.k.name + ' 课时讲解</div>';
    var x = e.clientX + 16, y = e.clientY - 8;
    if (x + tip.offsetWidth > window.innerWidth - 8) x = e.clientX - tip.offsetWidth - 16;
    if (y + tip.offsetHeight > window.innerHeight - 8) y = window.innerHeight - tip.offsetHeight - 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

/* ============ 旋转控制：慢速摆荡 + 拖拽 + 标签 billboard/深度淡出 ============ */
var spins = [document.getElementById('spinA'), document.getElementById('spinB')];
var stage = document.getElementById('stage');

var ry = -22, rx = -8;                 /* 当前实际角度 */
var ryBase = -22, rxBase = -8;         /* 拖拽累积的基准角度 */
var auto = true, dragging = false;
var lx = 0, ly = 0, dx0 = 0, dy0 = 0;
var swingT = 0, lastTs = 0, idleTimer = null, lastTap = 0;

/* 摆荡参数：周期越长＝越慢。Y 轴 ±16°/40 秒，X 轴 ±3°/26 秒 */
var SW_Y_AMP = 16, SW_Y_T = 40, SW_X_AMP = 3, SW_X_T = 26;
/* 标签开始出现的深度阈值（0=最远，1=最近） */
var LAB_ON = 0.58, LAB_FULL = 0.72;

var lastRy = 1e9, lastRx = 1e9;

function apply() {
    if (Math.abs(ry - lastRy) < 0.04 && Math.abs(rx - lastRx) < 0.04) return;
    lastRy = ry; lastRx = rx;

    var t = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    spins[0].style.transform = t;
    spins[1].style.transform = t;

    /* 标签反向旋转＝始终正对屏幕（billboard） */
    var bt = 'translateX(-50%) rotateY(' + (-ry).toFixed(2) + 'deg) rotateX(' + (-rx).toFixed(2) + 'deg)';

    var crx = rx * Math.PI / 180, cry = ry * Math.PI / 180;
    var cy = Math.cos(cry), sy = Math.sin(cry), cx = Math.cos(crx), sx = Math.sin(crx);

    for (var i = 0; i < nodeEls.length; i++) {
        var n = nodeEls[i];
        /* 旋转后的深度 z（CSS 顺序 rotateX 再 rotateY ⇒ p' = Rx·Ry·p） */
        var z1 = -n.x * sy + n.z * cy;
        var z2 = n.y * sx + z1 * cx;
        var o = (z2 + R) / (2 * R);
        if (o < 0) o = 0; else if (o > 1) o = 1;

        n.el.style.opacity = (0.20 + 0.80 * Math.pow(o, 1.5)).toFixed(3);

        var lo = (o - LAB_ON) / (LAB_FULL - LAB_ON);
        if (lo < 0) lo = 0; else if (lo > 1) lo = 1;
        if (n.hover) lo = 1;
        n.lab.style.opacity = lo.toFixed(3);
        if (lo > 0.001) n.lab.style.transform = bt;
    }
}

function swing(now) {
    var dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : 0;
    lastTs = now;
    if (auto && !dragging) {
        swingT += dt;
        ry = ryBase + Math.sin(swingT * (2 * Math.PI / SW_Y_T)) * SW_Y_AMP;
        rx = rxBase + Math.sin(swingT * (2 * Math.PI / SW_X_T)) * SW_X_AMP;
        apply();
    }
    requestAnimationFrame(swing);
}

/* 拖拽 */
function beginDrag(x, y) {
    dragging = true; auto = false; clearTimeout(idleTimer);
    lx = x; ly = y; dx0 = x; dy0 = y;
    stage.classList.add('dragging');
    return true;
}
function moveDrag(x, y) {
    if (!dragging) return;
    if (Math.abs(x - dx0) + Math.abs(y - dy0) > 5) dragMoved = true;
    ryBase += (x - lx) * 0.32;
    rxBase += (y - ly) * 0.22;
    if (rxBase > 85) rxBase = 85; else if (rxBase < -85) rxBase = -85;
    ry = ryBase; rx = rxBase;
    lx = x; ly = y; apply();
}
function endDrag() {
    if (!dragging) return;
    dragging = false; stage.classList.remove('dragging');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { swingT = 0; auto = true; }, 5000);
}

stage.addEventListener('mousedown', function (e) {
    dragMoved = false;
    if (e.target.closest('.node')) return;
    beginDrag(e.clientX, e.clientY);
});
window.addEventListener('mousemove', function (e) { moveDrag(e.clientX, e.clientY); });
window.addEventListener('mouseup', endDrag);

/* ---- 触屏（iPad / 手机）：单指拖动旋转、单指点节点跳转、双击复位 ---- */
stage.addEventListener('touchstart', function (e) {
    dragMoved = false;
    if (e.target.closest('.node')) return;
    var t = e.touches[0]; beginDrag(t.clientX, t.clientY);
}, { passive: true });
window.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    var t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
    e.preventDefault();          /* 阻止 Safari 橡皮筋回弹 / 双指缩放 */
}, { passive: false });
window.addEventListener('touchend', function (e) {
    /* 双指轻点两下复位视角（iOS 上 dblclick 不一定触发） */
    if (!dragMoved) {
        var now = Date.now();
        if (now - lastTap < 330) { resetView(); lastTap = 0; }
        else lastTap = now;
    }
    endDrag();
}, { passive: true });
window.addEventListener('touchcancel', endDrag);

/* 双击复位视角 */
function resetView() {
    ryBase = -22; rxBase = -8; swingT = 0; auto = true;
    clearTimeout(idleTimer);
    ry = ryBase; rx = rxBase; lastRy = 1e9; apply();
}
stage.addEventListener('dblclick', resetView);

/* hover 时强制显示该标签 */
nodeEls.forEach(function (n) {
    n.el.addEventListener('mouseenter', function () { n.hover = true; lastRy = 1e9; apply(); });
    n.el.addEventListener('mouseleave', function () { n.hover = false; lastRy = 1e9; apply(); });
});

/* ============ 自适应布局：让 iPad 横屏 / 竖屏 / 手机 / 桌面都完整显示 ============ */
var scene = document.getElementById('scene');
var legendEl = document.getElementById('legend');
var tagA = document.getElementById('tagA'), tagB = document.getElementById('tagB');
var SEP = 300;                                   /* 两球中心到舞台中心的距离（与 CSS 的 ±300px 一致） */

function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    var legendW = (getComputedStyle(legendEl).display === 'none') ? 0 : legendEl.offsetWidth;
    var shift = -legendW / 2;                    /* 把 3D 内容推到"去掉图例栏后"的可视中心 */

    var hudH = (h < 700) ? 92 : 118;             /* 顶部标题区高度 */
    var margin = 16;                             /* 视口边沿留白 */
    var labelHalfW = 56;                         /* 标签半宽（max-width 132px，60% 在边缘时被 ellipsis） */
    var labelBelow = 28;                         /* 标签往下 + margin-top + 行高 */

    /* 按宽度算：左右两球外缘 + 标签都不能超出 viewport */
    var availHalfW = (w - legendW) / 2 - margin - labelHalfW;
    var availHalfH = (h - hudH) / 2 - margin - labelBelow;
    var sepR = SEP + R;                          /* 中心到球外缘距离（沿球心连线） */

    var sByW = availHalfW / sepR;
    var sByH = availHalfH / R;
    var s = Math.min(sByW, sByH);
    if (s > 1) s = 1;
    if (s < 0.34) s = 0.34;

    scene.style.transform = 'translateX(' + shift.toFixed(1) + 'px) scale(' + s.toFixed(3) + ')';

    /* 册次标签跟随缩放，始终贴在各自球体正下方 */
    var cx = w / 2 + shift, cy = h / 2;
    var dy = (R + 42) * s;
    tagA.style.left = (cx - SEP * s) + 'px';
    tagB.style.left = (cx + SEP * s) + 'px';
    tagA.style.top = (cy + dy) + 'px';
    tagB.style.top = (cy + dy) + 'px';
    return s;
}

layout();
apply();
requestAnimationFrame(swing);

var rzT = null;
function relayout() {
    clearTimeout(rzT);
    rzT = setTimeout(function () { layout(); lastRy = 1e9; apply(); }, 100);
}
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () { layout(); lastRy = 1e9; apply(); }, 300);
});
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

/* 图例：按册次 → 单元 → 课时（可折叠） */
(function () {
    var body = document.getElementById('legendBody');
    var html = '';
    ['A', 'B'].forEach(function (vol) {
        html += '<div class="lg-vol">' + (vol === 'A' ? '一年级 · 上册' : '一年级 · 下册') + '</div>';
        var seen = [], map = {};
        GROUPS[vol].forEach(function (k) { if (!map[k.unit]) { map[k.unit] = []; seen.push(k.unit); } map[k.unit].push(k); });
        seen.forEach(function (unit, ui) {
            var lessons = map[unit];
            var color = 'c' + (lessons[0].cid % 8);
            var bg = { 0:'#ff5a4e',1:'#ff9a2e',2:'#f5cf1f',3:'#84d944',4:'#1fc9a2',5:'#35bcec',6:'#6270f5',7:'#ab5fee' }[lessons[0].cid % 8];
            html += '<div class="lg-unit" data-t="' + vol + ui + '"><span class="lg-dot" style="background:' + bg + '"></span>' +
                    unit + ' <span style="color:rgba(255,255,255,.45);font-size:11px">(' + lessons.length + ')</span>' +
                    '<span class="lg-caret">▸</span></div>';
            html += '<div class="lg-lessons" id="lg-' + vol + ui + '">';
            lessons.forEach(function (k, li) {
                html += '<div class="lg-lesson" data-u="' + k.url + '">' + (li + 1) + '. ' + k.name + '</div>';
            });
            html += '</div>';
        });
    });
    body.innerHTML = html;

    body.querySelectorAll('.lg-unit').forEach(function (el) {
        el.addEventListener('click', function () {
            var box = document.getElementById('lg-' + this.dataset.t);
            var open = box.classList.toggle('open');
            this.querySelector('.lg-caret').style.transform = open ? 'rotate(90deg)' : '';
        });
    });
    body.querySelectorAll('.lg-lesson').forEach(function (el) {
        el.addEventListener('click', function () { window.open(this.dataset.u, '_blank'); });
    });
})();
</script>
